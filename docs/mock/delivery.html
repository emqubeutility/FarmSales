<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Record Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#17261E;font-variant-numeric:tabular-nums}
button,input{font-family:inherit}
button{cursor:pointer}
.ph{width:390px;height:844px;background:#F3F5F1;display:flex;flex-direction:column;overflow:hidden}
.bar{background:#12301F;color:#fff;padding:16px;font-size:17px;font-weight:700}
.card{background:#fff;border:1px solid #DDE3DB;border-radius:12px;padding:14px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.muted{color:#5B6B61}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:52px;border-radius:10px;border:1px solid #C9D2C8;background:#fff;font-size:15px;font-weight:600;color:#17261E}
.seg button.on{background:#1F6B45;border-color:#1F6B45;color:#fff}
.btn{min-height:52px;border-radius:12px;border:1px solid #C9D2C8;background:#fff;font-size:16px;font-weight:700;color:#17261E;width:100%}
.btn.p{background:#1F6B45;border-color:#1F6B45;color:#fff}
.in{height:48px;border:1px solid #C9D2C8;border-radius:10px;padding:0 12px;font-size:17px;background:#fff;box-sizing:border-box;width:100%}
</style>
<style>body{background:#DDE3DB;display:flex;justify-content:center}.ph{height:100vh;min-height:844px}</style>
</head>
<body>
<div class="ph">
  <div class="bar">Delivery · OR-2043</div>
  <div style="flex:1;overflow:hidden;padding:14px;display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <div style="font-size:16px;font-weight:700">A. Patil · Zone 1</div>
      <div class="muted" style="font-size:13px;margin-top:2px">Flat 4B, [ADDRESS], Mumbai · +91 98XXXXXX45</div>
    </div>
    <div class="card">
      <div class="row"><span>A2 Cow Ghee 500 g × 1</span><span>₹780</span></div>
      <div class="row"><span>Delivery (Zone 1)</span><span>₹40</span></div>
      <div class="row" style="border-top:1px solid #EEF1EC;margin-top:6px;padding-top:8px;font-size:17px;font-weight:700"><span>Amount to collect</span><span>₹820</span></div>
    </div>
    <div>
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">How was it paid?</div>
      <div class="seg">
        <button class="on">Cash</button>
        <button>UPI</button>
        <button>Already paid</button>
      </div>
    </div>
    <div>
      <label for="amt" style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Amount collected (₹)</label>
      <input id="amt" class="in" value="820">
    </div>
    <div class="muted" style="font-size:12.5px;line-height:1.4">Cash stays "with delivery staff" until the office ticks it received on the Order desk.</div>
    <div style="flex:1"></div>
    <button class="btn p">Mark delivered</button>
    <button class="btn">Delivery failed</button>
  </div>
</div>
</body>
</html>
